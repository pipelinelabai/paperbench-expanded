schema_version = "1.1"

[task]
name = "paperbench-expanded/04-swg-anisotropic-phase-shifter-meep"

[metadata]
author_name = "pipelinelab"
difficulty = "hard"
category = "scientific-simulation"
tags = ["meep-fdtd", "photonics", "fixed-periodic-swg"]

[verifier]
user = "root"
timeout_sec = 21600.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}"
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL}"
JUDGE_API_BASE = "${JUDGE_API_BASE}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL}"
JUDGE_MODEL = "gpt-5.6-sol"
JUDGE_TIMEOUT_SEC = "300"

[agent]
user = "pbsolver"
timeout_sec = 25200.0

[agent.env]
NPM_CONFIG_PREFIX = "/home/pbsolver/.local"
PATH = "/home/pbsolver/.local/bin:/usr/local/bin:/usr/bin:/bin"

[environment]
build_timeout_sec = 86400.0
cpus = 8
memory_mb = 32768
storage_mb = 51200
