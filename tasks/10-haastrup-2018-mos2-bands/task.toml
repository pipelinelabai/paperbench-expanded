schema_version = "1.1"

[task]
name = "paperbench-expanded/10-haastrup-2018-mos2-bands"

[metadata]
harbor_scoring_enabled = true
verifier_backend = "host_native_replay"
author_name = "pipelinelab"
difficulty = "hard"
category = "scientific-simulation"
tags = ["quantum-espresso", "materials-science", "2d-materials", "spin-orbit-coupling", "replication"]

[verifier]
timeout_sec = 25200.0
user = "root"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}"
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL}"
JUDGE_API_BASE = "${JUDGE_API_BASE}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL}"
JUDGE_MODEL = "gpt-5.6-sol"
JUDGE_TIMEOUT_SEC = "300"

PBX_LLM_TRANSPORT = "auto"
PBX_LLM_MAX_TOOL_ROUNDS = "16"
PBX_LLM_FINAL_PARSE_RETRIES = "2"
PBX_LLM_FAIL_LOUD = "1"

[agent]
timeout_sec = 25200.0
user = "pbsolver"

[agent.env]
NPM_CONFIG_PREFIX = "/home/pbsolver/.local"
PATH = "/home/pbsolver/.local/bin:/usr/local/bin:/usr/bin:/bin"

[environment]
build_timeout_sec = 86400.0
cpus = 8
memory_mb = 32768
storage_mb = 51200
