schema_version = "1.1"

[task]
name = "paperbench-expanded/03-dual-passband-angular-stable-fss"

[metadata]
author_name = "pipelinelab"
difficulty = "hard"
category = "scientific-simulation"
tags = ["ansys-hfss", "pyaedt", "frequency-selective-surface", "angular-stability", "paper-reproduction"]

[verifier]
user = "root"
timeout_sec = 176400.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}"
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL}"
JUDGE_API_BASE = "${JUDGE_API_BASE}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL}"
JUDGE_MODEL = "gpt-5.6-sol"
JUDGE_TIMEOUT_SEC = "300"

# The private judge context is judge_addendum.md + addendum.md, which measures
# 65763 chars in this task; the default 64 KiB cap in tests/src/grader.py:69
# would abort every run before reward.txt is written. Raise the grader's own
# override (no truncation, no scored-content change) with headroom.
MAX_JUDGE_CONTEXT_CHARS = "131072"
PBX_SAFE_REPLAY_TIMEOUT_SEC = "172800"
PBX_LLM_TRANSPORT = "auto"
PBX_LLM_MAX_TOOL_ROUNDS = "16"
PBX_LLM_RETRIES = "4"

[agent]
user = "pbsolver"
timeout_sec = 172800.0

[environment]
build_timeout_sec = 86400.0
cpus = 32
memory_mb = 131072
storage_mb = 307200
