schema_version = "1.1"

[task]
name = "paperbench-expanded/11-horlbeck-2018-genetic-interactions"

[metadata]
author_name = "pipelinelab"
difficulty = "hard"
category = "computational-biology"
tags = ["crispri", "genetic-interactions", "replication", "robustness"]

[verifier]
timeout_sec = 21600.0
user = "root"

[verifier.env]
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL}"
JUDGE_MODEL = "${JUDGE_MODEL}"
JUDGE_TIMEOUT_SEC = "300"
PBX_LLM_TRANSPORT = "openai"

[agent]
timeout_sec = 21600.0
user = "pbsolver"

[agent.env]
NPM_CONFIG_PREFIX = "/home/pbsolver/.local"
PATH = "/home/pbsolver/.local/bin:/usr/local/bin:/usr/bin:/bin"

[environment]
build_timeout_sec = 86400.0
cpus = 8
memory_mb = 32768
storage_mb = 51200
