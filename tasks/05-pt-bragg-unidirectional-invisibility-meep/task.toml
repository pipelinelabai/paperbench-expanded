schema_version = "1.1"

[task]
name = "paperbench-expanded/05-pt-bragg-unidirectional-invisibility-meep"

[metadata]
harbor_scoring_enabled = true
verifier_backend = "host_native_replay"
author_name = "pipelinelab"
difficulty = "hard"
category = "scientific-simulation"
tags = ["meep", "fixed-model", "complex-fields"]
[agent]
user = "pbsolver"
timeout_sec = 18000.0
[verifier]
user = "root"
timeout_sec = 18000.0
[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_API_BASE = "${JUDGE_API_BASE:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-gpt-5.6-sol}"
JUDGE_TRANSPORT = "${JUDGE_TRANSPORT:-openai}"
JUDGE_TIMEOUT_SEC = "300"

[environment]
build_timeout_sec = 86400.0
cpus = 8
memory_mb = 32768
storage_mb = 51200
